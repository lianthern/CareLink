<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>UNSEEN 3.0 · 官方案例馆与个人回忆</title>
  <meta name="description" content="UNSEEN 3.0 可运行体验：看看官方案例，用自己的照片完成对话与本机记忆，并理解 DAP、World Labs 与 3DGS 的真实边界。">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/unseen-demo.css?v=20260905-gallery9">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i>
  </div>

  <main class="prototype-shell" aria-label="UNSEEN 3.0 可运行体验">
    <section class="phone" aria-label="手机界面预览">
      <div class="phone-screen">
        <div class="status-bar" aria-hidden="true">
          <time>9:41</time>
          <span>•••  5G  ▰</span>
        </div>
        <div id="app" class="app-view" aria-live="polite"></div>
        <div id="overlay-root"></div>
      </div>
    </section>

    <aside class="review-rail" aria-label="样机说明与页面目录">
      <p class="rail-kicker">UNSEEN 3.0 · OFFICIAL GALLERY</p>
      <h1>官方案例归看看，<br>自己的回忆归自己。</h1>
      <p>官方案例只读；中央“＋”只接本机照片；“我的”只显示本机个人内容。DAP 与 World Labs 已接通，3DGS 仍明确等待。</p>

      <div class="rail-rule"></div>
      <nav id="screen-menu" class="screen-menu" aria-label="直接查看样机页面"></nav>
      <div class="rail-note">
        <span class="demo-dot"></span>
        <p><b>评审重点</b>案例是否像策展而非社交 feed；官方内容与个人数据是否彻底分开。</p>
      </div>
      <p class="rail-shortcuts">← → 切换画面 · R 重置演示</p>
    </aside>
  </main>

  <input id="unseen-photo-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" tabindex="-1" aria-hidden="true">
  <input id="unseen-camera-input" class="visually-hidden" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <script type="module" src="/unseen-demo.js?v=20260905-content-fixes1"></script>
</body>
</html>
