<style>
html,body{margin:0;min-width:320px;background:#eee9f6;color:#413757;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.boot{min-height:100svh;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 10% 10%,#dfeafa,transparent 55%),radial-gradient(ellipse at 90% 60%,#f7dde9,transparent 65%)}
.boot-photo{position:relative;margin:0 auto 32px;width:88px;height:106px;border:7px solid #fffafc;border-bottom-width:22px;box-shadow:0 14px 40px #70668325;transform:rotate(-7deg);background:linear-gradient(145deg,#c7d8eb,#efd1df);animation:develop 2.4s ease-in-out infinite alternate}
.boot-photo:after{content:"";position:absolute;inset:18px 12px;border:1px solid #fff9;border-radius:50% 50% 12% 12%;background:#fff4}
.boot h1{font:24px "Songti SC","STSong",serif;letter-spacing:.12em;margin:0 0 14px}.boot p{font-size:14px;line-height:1.8;margin:0;color:#706683}.boot button{margin:20px auto 0;border:1px solid #8973ab;border-radius:24px;background:#fff8;padding:11px 24px;color:#413757;font:inherit;cursor:pointer}.boot button:focus-visible{outline:3px solid #8973ab;outline-offset:4px}.boot.failed .boot-photo{animation:none}.boot [hidden]{display:none}
@keyframes develop{from{opacity:.45;filter:blur(2px)}to{opacity:1;filter:blur(0)}}
@media(prefers-reduced-motion:reduce){.boot-photo{animation:none}}
</style>

<script>
(() => {
 let done=false;const status=document.getElementById('boot-status'),panel=document.getElementById('moment-boot'),retry=document.getElementById('boot-retry');
 const fail=()=>{if(done)return;panel.classList.add('failed');status.textContent='暂时没能打开，请检查网络后重试。';retry.hidden=false;};
 const timer=setTimeout(()=>{if(done)return;panel.classList.add('failed');status.textContent='加载比平时久，可以继续等待或重新打开。';retry.hidden=false;},12000);
 window.momentBoot={ready(){done=true;clearTimeout(timer);},fail};
 const styles=['optimized/v2.css'];
 const css=Promise.all(styles.map(name=>new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href='/app-assets/8dcfb05c64aec182a04c4b6a/'+name;link.media='print';link.onload=()=>{link.media='all';resolve();};link.onerror=reject;document.head.append(link);}))).catch(error=>{fail();throw error;});
 // Fetch module graph while CSS arrives; entry waits for styles before first render.
 window.momentStyles=css;
 import('/app-assets/8dcfb05c64aec182a04c4b6a/optimized/moment-app.js').catch(fail);
})();
</script>
