name: validate-bridge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JSON contracts and forbidden-file boundary
        run: python3 -B scripts/verify_bridge.py
      - name: Test deterministic Release publisher
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test v15 local product and recovery contracts
        run: python3 -B -m unittest discover -s jobs/to-4060/unseen-3dgs-local-product-2026-09-04-v15/inputs/tests -p 'test_*.py' -v
      - name: Check packaged Linux and Viewer syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find jobs/to-4060/unseen-3dgs-local-product-2026-09-04-v15/inputs/scripts/linux -type f -name '*.sh' -print0)
          node --check jobs/to-4060/unseen-3dgs-local-product-2026-09-04-v15/inputs/viewer/app.js
          if command -v shellcheck >/dev/null 2>&1; then
            find jobs/to-4060/unseen-3dgs-local-product-2026-09-04-v15/inputs/scripts/linux -type f -name '*.sh' -print0 | xargs -0 shellcheck
          fi

  windows-powershell-51-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -ne 1 -or
              $PSVersionTable.PSEdition -ne "Desktop") {
            throw "Expected Windows PowerShell Desktop 5.1, found edition=$($PSVersionTable.PSEdition) version=$($PSVersionTable.PSVersion)"
          }
          $allErrors = New-Object System.Collections.Generic.List[string]
          $scripts = @(Get-ChildItem -LiteralPath . -Recurse -File -Filter '*.ps1')
          if ($scripts.Count -lt 1) {
            throw "No PowerShell scripts were discovered; refusing a vacuous parse pass."
          }
          $scripts | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            foreach ($parseError in @($parseErrors)) {
              $allErrors.Add("$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)")
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            throw "Windows PowerShell 5.1 parse failed for $($allErrors.Count) error(s)."
          }
          Write-Host "Windows PowerShell Desktop 5.1 parsed $($scripts.Count) script(s)."
      - name: Run Windows contract tests
        shell: powershell
        run: python -B -m unittest discover -s jobs/to-4060/unseen-3dgs-local-product-2026-09-04-v15/inputs/tests -p 'test_windows_scripts_contract.py' -v
      - name: Exercise exact-run launcher success and fail-closed paths
        shell: powershell
        run: .\scripts\windows\tests\Test-V15-LauncherRuntime.ps1
