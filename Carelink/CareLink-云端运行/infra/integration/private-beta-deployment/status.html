<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>UNSEEN · 好友邀请 Beta</title>
  <style>
    :root{color-scheme:light;--ink:#291d21;--muted:#74666b;--paper:#fff9f7;--rose:#b44b69;--line:#ead9dd}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}
    main{max-width:720px;margin:0 auto;padding:12vh 24px 64px}.mark{font-weight:800;letter-spacing:.12em;color:var(--rose)}
    h1{font-size:clamp(2rem,7vw,4.5rem);line-height:1.06;margin:.55rem 0 1.2rem;letter-spacing:-.04em}
    .lead{font-size:1.15rem;max-width:36rem}.card{margin-top:2rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:#fff}
    .state{display:inline-block;padding:.2rem .65rem;border-radius:99px;background:#f5e5ea;color:#7e2f49;font-weight:700}
    ul{padding-left:1.25rem}.fine{color:var(--muted);font-size:.9rem;margin-top:2rem}
  </style>
</head>
<body><main>
  <p class="mark">UNSEEN</p>
  <h1>把一起经历的现场，留给真正参与的人。</h1>
  <p class="lead">好友邀请 Beta 的服务器与加密入口已经就绪。当前页面不使用样本、fixture 或模拟 AI 数据。</p>
  <section class="card" aria-labelledby="status"><span class="state">基础入口已上线</span><h2 id="status">功能接线状态</h2>
    <ul><li>真实持久数据库与媒体目录已启用，应用只在服务器回环地址监听。</li>
    <li>好友查看、上传与管理入口正在等待真实邮箱验证码服务接通；现在不接收照片或账号资料。</li>
    <li>记忆成书、照片问题与 AI provider 暂未启用，不会用 fallback 代替。</li></ul>
  </section>
  <p class="fine">这是受控邀请制基础版，不是公开发布完成声明。请保留访问凭据，不要转发。</p>
</main></body></html>
