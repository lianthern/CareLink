# Demo-book unauthenticated static mount — NOT wired in automatically.
#
# Why this file exists instead of a direct edit to ./Caddyfile: this worktree has no server access
# and must not touch production routing unreviewed (see tools/demo-book/README.md for the full
# rationale and the rest of the mounting checklist). An operator with real access to
# infra/integration/private-beta-deployment/Caddyfile applies this by hand, reviews the diff, and
# runs `caddy validate` + `caddy reload` themselves.
#
# What it does: today the *entire* private-beta domain sits behind one catch-all
# `handle { basicauth ... } ...` block (see ./Caddyfile) — there is no public route anywhere,
# by design (services/book-lab has "no ... Viewer ... route" on purpose; see services/book-lab/README.md).
# The demo book is not real user data, so this snippet carves out one additional unauthenticated
# path — /demo-book/* — the same way the existing `@private_ai` matcher already carves out
# /__internal/private-ai/v1/* before the basicauth catch-all. Ordering matters: Caddy evaluates
# `handle` blocks top-to-bottom and stops at the first match, so this block MUST be inserted above
# the trailing `handle { basicauth ... } ...` block and below the existing `@private_ai` block.
#
# It serves from its OWN root (/var/www/unseen-demo-book), never /var/www/unseen-private-beta, so
# this can never accidentally expose the real private-beta SPA build unauthenticated.
#
# --- insert inside the REQUIRED_PRIVATE_BETA_DOMAIN { ... } block, after the existing
#     `handle @private_ai { ... }` block and before the trailing `handle { basicauth ... } ...` block ---

	@demo_book path /demo-book /demo-book/*
	handle @demo_book {
		header {
			Cache-Control "public, max-age=300"
			X-Robots-Tag "noindex, nofollow"
			-Server
		}
		uri strip_prefix /demo-book
		root * /var/www/unseen-demo-book
		try_files {path} /index.html
		file_server
	}

# --- end insert ---
#
# After inserting: `caddy validate --config Caddyfile` then `caddy reload --config Caddyfile`
# (or the deployment's normal equivalent). See tools/demo-book/server/install-demo-book-static.sh
# for populating /var/www/unseen-demo-book itself.
