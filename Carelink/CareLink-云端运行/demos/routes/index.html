<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UNSEEN · 技术路线</title>
  <meta name="description" content="UNSEEN 技术路线：DAP 深度漫游、3DGS 高斯重建、World Labs 照片生成。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@650&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
  <style>
    :root {
      --sea: #16343c;
      --sea-deep: #0e2328;
      --salt: #f3eee4;
      --limestone: #d8cfc2;
      --brass: #b08a4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--sea-deep); color: var(--salt); font-family: "Noto Sans SC", "Outfit", sans-serif; }
    a { color: var(--brass); }
    .mast {
      position: sticky; top: 0; z-index: 4;
      display: flex; justify-content: space-between; gap: 1rem; align-items: baseline;
      padding: 1rem 1.3rem;
      background: color-mix(in srgb, var(--sea-deep) 88%, transparent);
      backdrop-filter: blur(10px);
    }
    .mast p { margin: 0; font-family: "Newsreader", serif; font-style: italic; color: var(--limestone); }
    .mast b { font-family: "Outfit", sans-serif; font-weight: 500; letter-spacing: .08em; font-size: .72rem; color: var(--brass); text-transform: uppercase; }
    nav { display: flex; gap: .8rem; padding: .2rem 1.3rem 1rem; flex-wrap: wrap; }
    nav a { color: var(--limestone); text-decoration: none; font-size: .86rem; }
    .route { padding: .4rem 1.2rem 2.4rem; max-width: 1100px; margin: 0 auto; }
    .route header p { margin: 0; color: var(--brass); letter-spacing: .12em; font-size: .74rem; text-transform: uppercase; }
    .route h2 { margin: .35rem 0 .4rem; font-family: "Noto Serif SC", serif; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    .lead { margin: 0 0 1.2rem; color: var(--limestone); max-width: 42rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .card {
      appearance: none; border: 0; padding: 0; text-align: left; color: inherit;
      background: color-mix(in srgb, #1b3338 80%, black); cursor: pointer;
    }
    .card:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
    .shot { display: block; aspect-ratio: 16/10; overflow: hidden; background: #122026; }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .copy { display: block; padding: .75rem .8rem 1rem; }
    .copy small { display: block; color: var(--brass); font-size: .72rem; letter-spacing: .04em; }
    .copy strong { display: block; margin: .2rem 0; font-family: "Noto Serif SC", serif; font-size: 1.15rem; }
    .copy em { font-style: normal; color: var(--limestone); font-size: .84rem; }
    .stage {
      position: fixed; inset: 0; z-index: 10; display: none;
      grid-template-rows: auto 1fr auto; background: #0a1619;
    }
    .stage.open, .stage.open[hidden] { display: grid; }
    .bar, .foot { display: flex; justify-content: space-between; gap: .8rem; align-items: center; padding: .7rem 1rem; flex-wrap: wrap; }
    .bar h3 { margin: 0; font-family: "Noto Serif SC", serif; }
    .bar p, .foot p { margin: 0; color: var(--limestone); font-size: .82rem; }
    .ghost { appearance: none; border: 1px solid color-mix(in srgb, var(--limestone) 40%, transparent); background: transparent; color: var(--salt); padding: .35rem .7rem; cursor: pointer; }
    #viewport { min-height: 0; background: #122026; }
    #viewport canvas, #viewport iframe, #viewport img { width: 100%; height: 100%; border: 0; display: block; }
    #stage-extra { display: flex; gap: .8rem; flex-wrap: wrap; }
    @media (max-width: 700px) {
      .mast b { display: none; }
      .route { padding-inline: .8rem; }
    }
  </style>
</head>
<body>
  <header class="mast">
    <p>UNSEEN 技术路线：从 DAP 走到 3DGS，再到 World Labs。</p>
    <b>UNSEEN</b>
  </header>
  <nav>
    <a href="#dap">DAP</a>
    <a href="#gs">3DGS</a>
    <a href="#worldlab">World Labs</a>
  </nav>
  <main id="main"></main>
  <section class="stage" id="stage" hidden>
    <div class="bar">
      <div>
        <h3 id="stage-title"></h3>
        <p id="stage-meta"></p>
      </div>
      <button class="ghost" id="close-stage" type="button">离开</button>
    </div>
    <div id="viewport"></div>
    <div class="foot">
      <p id="stage-status">正在打开…</p>
      <div id="stage-extra"></div>
    </div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
