<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UNSEEN · 一场婚礼，两个空间</title>
<meta http-equiv="refresh" content="0;url=./m/">
<script>
(function(){
  var wide = window.matchMedia('(min-width: 900px) and (pointer: fine)').matches
    || (window.innerWidth >= 900 && window.innerHeight >= 560);
  location.replace(wide ? './desktop/' : './m/');
})();
</script>
</head>
<body style="margin:0;background:#241d3a;color:#f3e2bc;font:16px/1.6 -apple-system,sans-serif;padding:40px">
<p>正在进入空间…</p>
<p><a href="./m/" style="color:#e2c288">手机版</a> · <a href="./desktop/" style="color:#e2c288">桌面版</a></p>
</body>
</html>
