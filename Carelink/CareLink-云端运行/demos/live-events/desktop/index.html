<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>UNSEEN · 一场婚礼，两个空间</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --gold:#C9A45B;--gold2:#E2C288;--gold3:#F3E2BC;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --en:"Cormorant Garamond","Georgia",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1526;font-family:var(--sans);color:#F5EEF9;-webkit-font-smoothing:antialiased}
.deck{position:fixed;inset:0;overflow:hidden}
.stage{
  width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;
  overflow:hidden;border-radius:2px;box-shadow:0 30px 80px rgba(0,0,0,.45);
  background:radial-gradient(ellipse 80% 70% at 50% 20%,#5b4a8a 0%,#3a2f5e 45%,#241d3a 100%);
}
.bokeh{position:absolute;border-radius:50%;filter:blur(28px);pointer-events:none;opacity:.35}
.bokeh.b1{width:420px;height:420px;left:-120px;top:-100px;background:radial-gradient(circle,#bcd0ff,transparent 70%)}
.bokeh.b2{width:520px;height:520px;right:-160px;top:120px;background:radial-gradient(circle,#ffd5e3,transparent 70%)}
.frame{position:absolute;inset:20px;border:1px solid rgba(201,164,91,.42);pointer-events:none;z-index:9}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(201,164,91,.16)}
.frame i{position:absolute;width:9px;height:9px;background:linear-gradient(135deg,#E2C288,#C9A45B);transform:rotate(45deg)}
.frame i:nth-child(1){left:-5px;top:-5px}
.frame i:nth-child(2){right:-5px;top:-5px}
.frame i:nth-child(3){left:-5px;bottom:-5px}
.frame i:nth-child(4){right:-5px;bottom:-5px}
.brand{position:absolute;left:40px;top:26px;font-family:var(--en);font-style:italic;font-size:15px;letter-spacing:.26em;color:#B9AED3;z-index:10}
.hint{position:absolute;right:40px;top:28px;font-size:13px;letter-spacing:.14em;color:#9E93BD;z-index:10}
.slide{position:absolute;inset:0;padding:58px 92px 55px}
.kicker{font-family:var(--en);font-style:italic;font-size:19px;letter-spacing:.28em;color:var(--gold2);text-transform:uppercase;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.kicker::before{content:"";width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.04em}
h2{font-size:44px;line-height:1.3}
h2 em{font-style:normal;background:linear-gradient(90deg,#F3E2BC,#E2C288 50%,#D9B872);-webkit-background-clip:text;background-clip:text;color:transparent}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;margin-top:34px}
.panel{min-width:0}
.panel h3{font-size:27px;letter-spacing:.015em}
.topline{display:flex;justify-content:space-between;align-items:center;gap:14px}
.caption{margin:12px 0 18px;color:#d8cfea;font-size:19px;line-height:1.5}
.btn{font-family:var(--sans);font-size:15px;padding:8px 17px;color:#f3e2bc;background:rgba(255,255,255,.1);border:1px solid rgba(201,164,91,.65);border-radius:30px;cursor:pointer}
.viewport{height:530px;position:relative;overflow:hidden;background:#17151f;border:1px solid rgba(226,194,136,.5);border-radius:18px}
.viewport iframe{display:block;width:100%;height:100%;border:0;background:#120f18}
.viewport.expanded{position:absolute;inset:32px;height:auto;z-index:31;box-shadow:0 0 0 40px #221c32}
.shrink{display:none;position:absolute;right:18px;top:15px;z-index:20;background:rgba(20,18,29,.9);color:#fff;border:1px solid #fff6;border-radius:30px;padding:10px 18px;font-size:15px;cursor:pointer}
.viewport.expanded .shrink{display:block}
@media (prefers-reduced-motion:reduce){.bokeh{display:none}}
</style>
</head>
<body>
<div class="deck"><div class="stage" id="stage">
  <div class="bokeh b1"></div><div class="bokeh b2"></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <div class="brand">UNSEEN · MEMORY MOMENT</div>
  <div class="hint">点击画面后拖动 / WASD · F 全屏 · Esc 收起</div>
  <section class="slide">
    <div class="kicker">Live Spaces</div>
    <h2>一场婚礼，<em>两个空间</em></h2>
    <div class="pair">
      <article class="panel">
        <div class="topline">
          <h3>空间一</h3>
          <button class="btn" data-expand="view-a">放大操作</button>
        </div>
        <p class="caption">可以转向、移动、缩放。</p>
        <div class="viewport" id="view-a">
          <iframe title="空间一" data-src="../viewer/index.html?scene=../portrait/scene.json" allow="fullscreen"></iframe>
          <button class="shrink" type="button">× 收起</button>
        </div>
      </article>
      <article class="panel">
        <div class="topline">
          <h3>空间二</h3>
          <button class="btn" data-expand="view-b">放大操作</button>
        </div>
        <p class="caption">可以转向、移动、缩放。</p>
        <div class="viewport" id="view-b">
          <iframe title="空间二" data-src="../viewer/index.html?scene=../landscape/scene.json" allow="fullscreen"></iframe>
          <button class="shrink" type="button">× 收起</button>
        </div>
      </article>
    </div>
  </section>
</div></div>
<script>
(function(){
  const stage = document.getElementById('stage');
  function fit(){
    const vv = window.visualViewport;
    const w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
    stage.style.transform = 'translate(-50%,-50%) scale(' + Math.min(w/1600, h/900)*0.96 + ')';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  addEventListener('load', fit);
  fit();

  const frames = [...document.querySelectorAll('iframe')];
  function load(frame){
    if (frame.dataset.src){ frame.src = frame.dataset.src; delete frame.dataset.src; }
  }
  load(frames[0]);
  frames[0].addEventListener('load', () => setTimeout(() => load(frames[1]), 400), {once:true});
  setTimeout(() => load(frames[1]), 8000);

  const command = (frame, type) => { try { frame.contentWindow.postMessage({type}, location.origin); } catch (e) {} };
  const pauseOthers = (keep) => {
    frames.forEach(f => command(f, f.closest('.viewport') === keep ? 'viewer-resume' : 'viewer-pause'));
  };
  const collapse = () => {
    document.querySelectorAll('.viewport.expanded').forEach(v => v.classList.remove('expanded'));
    frames.forEach(f => command(f, 'viewer-resume'));
  };
  document.querySelectorAll('[data-expand]').forEach(btn => {
    btn.addEventListener('click', () => {
      const view = document.getElementById(btn.dataset.expand);
      const on = !view.classList.contains('expanded');
      collapse();
      if (on) { view.classList.add('expanded'); pauseOthers(view); load(view.querySelector('iframe')); }
    });
  });
  document.querySelectorAll('.shrink').forEach(btn => btn.addEventListener('click', collapse));
  addEventListener('keydown', e => {
    if (e.key === 'Escape') collapse();
    if ((e.key === 'f' || e.key === 'F') && !e.target.closest('input,textarea')) {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });
  addEventListener('message', e => {
    if (e.origin !== location.origin) return;
    if (e.data?.type === 'presentation-key' && e.data.key === 'Escape') collapse();
  });
})();
</script>
</body>
</html>
