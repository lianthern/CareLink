<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142536">
  <meta name="robots" content="noindex,nofollow">
  <title>回见 · 阿见</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="回见">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell" id="app">
    <header class="brand" aria-label="回见">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>回见</span>
    </header>

    <section class="screen start-screen" id="screen-start">
      <div class="start-intro">
        <div class="agent agent--hero entering" id="start-agent" role="img" aria-label="阿见，一张会折角的小相片">
          <span class="agent-paper">
            <span class="agent-eye agent-eye--left"></span>
            <span class="agent-eye agent-eye--right"></span>
            <span class="agent-fold"></span>
          </span>
        </div>
        <div class="start-copy">
          <h1>我是阿见。</h1>
          <p>给我一张照片，我先告诉你看到了什么，再陪你聊两句。</p>
        </div>
      </div>

      <div class="start-actions">
        <button class="primary-action" id="upload-start" type="button">选一张照片</button>
        <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="secondary-action" id="demo-start" type="button">先试一张</button>
      </div>

      <p class="photo-error" id="photo-error" role="alert" hidden></p>
      <p class="privacy-note">照片与回答会发送给 MiniMax 生成提问；本站不持久保存，刷新后本次内容会清空。</p>
    </section>

    <section class="screen chat-screen" id="screen-chat" tabindex="-1" hidden>
      <div class="chat-topline">
        <button class="back-action" id="back-start" type="button">重新选照片</button>
      </div>

      <figure class="photo-card" id="photo-frame">
        <img id="chat-photo" alt="你刚选择的照片">
        <figcaption class="observation-strip">
          <div class="agent agent--attached seeing" id="chat-agent" role="img" aria-label="阿见正在看照片">
            <span class="agent-paper">
              <span class="agent-eye agent-eye--left"></span>
              <span class="agent-eye agent-eye--right"></span>
              <span class="agent-fold"></span>
            </span>
          </div>
          <div class="agent-live" id="agent-live" aria-live="polite">
            <p class="status-text" id="status-text">我在看画面里确定的东西……</p>
            <p class="observation" id="observation" hidden></p>
          </div>
        </figcaption>
      </figure>

      <button class="secondary-action self-start" id="speak-first" type="button" hidden>先自己说</button>

      <div class="conversation">
        <button class="history-summary" id="history-summary" type="button" aria-expanded="false" hidden>
          <span id="history-count">已经写下 1 段</span><span id="history-toggle">展开</span>
        </button>
        <div class="thread" id="thread" hidden></div>

        <section class="current-turn" id="current-turn" aria-live="polite">
          <p class="question" id="question" hidden></p>
          <p class="degraded-note" id="degraded-note" hidden></p>
        </section>

        <label class="composer" id="composer" for="answer">
          <span class="sr-only">回答阿见的问题</span>
          <textarea id="answer" rows="3" placeholder="想到什么，就说什么。" disabled></textarea>
          <span class="composer-hint">⌘ / Ctrl + Enter 也可以</span>
        </label>

        <button class="primary-action" id="commit-answer" type="button" disabled>说好了</button>

        <div class="quiet-actions" id="quiet-actions">
          <button class="secondary-action" id="new-question" type="button" disabled>换个问法</button>
          <button class="secondary-action" id="finish-memory" type="button" hidden>就先留这些</button>
        </div>

        <section class="decision-panel" id="decision-panel" hidden>
          <p id="decision-copy">这张照片已经有故事了。再补一句，还是就这样留下？</p>
          <div class="decision-actions">
            <button class="secondary-action" id="add-one" type="button">再补一句</button>
            <button class="primary-action" id="decision-finish" type="button">就这样留下</button>
          </div>
        </section>

        <section class="decision-panel recovery-panel" id="recovery-panel" hidden>
          <p>刚才那句话已经留下了。我们就先放成一页吧。</p>
          <div class="decision-actions">
            <button class="secondary-action" id="retry-question" type="button">再试一次</button>
            <button class="primary-action" id="recovery-finish" type="button">看看这一页</button>
          </div>
        </section>
      </div>
    </section>

    <section class="screen result-screen" id="screen-result" hidden>
      <div class="closing-note">
        <div class="agent agent--result closing" role="img" aria-label="阿见把照片和原话放成一页">
          <span class="agent-paper">
            <span class="agent-eye agent-eye--left"></span>
            <span class="agent-eye agent-eye--right"></span>
            <span class="agent-fold"></span>
          </span>
        </div>
        <p>照片留原样，你的话也留原样。<br>一起放成这一页。</p>
      </div>

      <article class="memory-page" id="memory-page">
        <div class="memory-photo-wrap"><img id="result-photo" alt="你刚选择的照片"></div>
        <div class="memory-page-copy">
          <p class="memory-date" id="memory-date"></p>
          <h1 id="memory-title" tabindex="-1">这一刻，留在这里</h1>
          <div id="memory-writing"></div>
          <p class="memory-signature">回见 · 阿见陪你留下一页</p>
        </div>
      </article>

      <div class="result-actions">
        <button class="primary-action" id="print-memory" type="button">保存这一页 / PDF</button>
        <button class="secondary-action" id="edit-memory" type="button">回去改改原话</button>
        <button class="secondary-action" id="restart" type="button">再记一张</button>
      </div>
      <p class="next-note">离开后不会自动保留，喜欢这一页就先保存下来。</p>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
