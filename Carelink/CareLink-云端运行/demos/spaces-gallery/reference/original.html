<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>回忆时刻 UNSEEN</title>
<style>
/* ================= 设计令牌 ================= */
:root{
  --ink:#413757; --ink2:#6C6389; --muted:#948BAB;
  --gold:#E2C288; --gold-d:#B9914D; --gold-l:#FAF0DA; --gold-dd:#8A6A32;
  --rose:#F4A9C2; --rose-d:#E37FA4; --rose-l:#FDE7EF;
  --blue:#A9C1EF; --blue-d:#7B99DE; --blue-l:#E7EEFC;
  --violet:#C6BCEC;
  --glass:rgba(255,255,255,.55);
  --serif:"Songti SC","STSong","Noto Serif SC","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --r:22px;
  --sh:0 14px 38px rgba(96,84,142,.22);
  --sh-s:0 5px 16px rgba(96,84,142,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(900px 620px at 14% 6%,#D8E5FB 0%,rgba(216,229,251,0) 62%),
    radial-gradient(820px 600px at 88% 12%,#F6DEEA 0%,rgba(246,222,234,0) 60%),
    radial-gradient(900px 700px at 50% 108%,#FBE7DC 0%,rgba(251,231,220,0) 62%),
    linear-gradient(160deg,#E6EDFB 0%,#EDE6F7 46%,#FBE9EF 100%);
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}

/* 背景装饰 */
.bokeh{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bokeh i{
  position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.08) 62%);
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translate3d(0,0,0) scale(1);opacity:.16}
  50%{transform:translate3d(14px,-38px,0) scale(1.08);opacity:.5}
  100%{transform:translate3d(0,0,0) scale(1);opacity:.16}
}
.veil{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(70% 55% at 50% 45%,rgba(255,255,255,.25),rgba(255,255,255,0) 70%)}

/* ================= 舞台 / 机身 ================= */
.stage{position:fixed;inset:0;display:grid;place-items:center;z-index:2}
.device{
  width:392px;height:848px;border-radius:56px;position:relative;flex:none;
  background:linear-gradient(150deg,#F6F1FA,#DCD3E6 40%,#F8EEF3 62%,#CFC6DD);
  padding:12px;transform:scale(var(--ps,1));
  box-shadow:0 40px 90px rgba(90,78,130,.34),0 4px 0 rgba(255,255,255,.6) inset,0 0 0 1px rgba(255,255,255,.6);
}
.device::after{
  content:"";position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  width:128px;height:5px;border-radius:99px;background:rgba(255,255,255,.7);z-index:80;pointer-events:none
}
.viewport{
  width:100%;height:100%;border-radius:45px;overflow:hidden;position:relative;
  background:
    radial-gradient(120% 70% at 18% 0%,#E5EDFD 0%,rgba(229,237,253,0) 58%),
    radial-gradient(110% 65% at 92% 8%,#FAE3EF 0%,rgba(250,227,239,0) 60%),
    radial-gradient(130% 80% at 50% 106%,#FDF0E4 0%,rgba(253,240,228,0) 60%),
    linear-gradient(178deg,#EDF2FE 0%,#F2EAF8 48%,#FCEDF1 100%);
  display:flex;flex-direction:column;
}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:114px;height:31px;border-radius:99px;
  background:#2A2438;z-index:70}
.deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.75}
.deco .vig{position:absolute;inset:0;background:radial-gradient(78% 58% at 50% 42%,rgba(255,255,255,0) 40%,rgba(120,104,160,.16) 100%)}
/* 装饰小物 */
.orn{position:absolute;pointer-events:none;z-index:1;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.bal{width:36px;height:45px;border-radius:50% 50% 46% 46%;position:relative;
  box-shadow:0 8px 18px rgba(120,100,160,.22),inset -4px -6px 12px rgba(120,90,140,.18)}
.bal::before{content:"";position:absolute;left:50%;top:99%;margin-left:-3px;border-left:3px solid transparent;
  border-right:3px solid transparent;border-top:6px solid rgba(255,255,255,.55)}
.bal::after{content:"";position:absolute;left:50%;top:104%;width:1px;height:46px;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.bal i{position:absolute;left:20%;top:14%;width:30%;height:24%;border-radius:50%;background:rgba(255,255,255,.8);filter:blur(1.5px)}
.bal.pink{background:linear-gradient(150deg,#FFD9E6,#F3A2C0 62%,#E285A8)}
.bal.silver{background:linear-gradient(150deg,#FBFCFF,#D5DAEA 58%,#B4BCD4)}
.bal.gold{background:linear-gradient(150deg,#FDF1D6,#E9C88C 58%,#CFA75F)}
.bow{position:relative;width:40px;height:22px}
.bow i{position:absolute;top:0;width:17px;height:22px;border-radius:60% 40% 55% 45%;
  background:linear-gradient(150deg,#FFE0EB,#F0A2C0);box-shadow:0 4px 10px rgba(200,140,175,.3)}
.bow i:first-child{left:0;transform:rotate(-16deg)}
.bow i:nth-child(2){right:0;transform:rotate(16deg) scaleX(-1)}
.bow b{position:absolute;left:50%;top:6px;margin-left:-5px;width:10px;height:10px;border-radius:50%;
  background:linear-gradient(150deg,#FFF0F5,#EC9CBC)}
.petal{position:absolute;width:12px;height:12px;border-radius:60% 0 60% 0;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,225,238,.95),rgba(244,175,205,.75));animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:0}
  15%{opacity:.9}85%{opacity:.7}100%{transform:translateY(760px) rotate(320deg);opacity:0}}
.pband{position:absolute;left:-10%;right:-10%;top:-40px;height:270px;filter:blur(34px);opacity:.4;
  background:linear-gradient(180deg,#F7C4D8 0%,#D9C7F0 46%,rgba(255,255,255,0) 100%)}
.spk{position:absolute;width:var(--s,10px);height:var(--s,10px);pointer-events:none;
  background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
  animation:tw 3.2s ease-in-out infinite;filter:drop-shadow(0 0 4px rgba(255,240,200,.9))}
@keyframes tw{0%,100%{transform:scale(.5) rotate(0);opacity:.25}50%{transform:scale(1) rotate(24deg);opacity:.95}}

/* 状态栏 */
.sbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px 0;font-size:13px;font-weight:600;letter-spacing:.02em;z-index:20;position:relative}
.sbar .r{display:flex;align-items:center;gap:5px}
.bars{display:flex;align-items:flex-end;gap:2px;height:10px}
.bars i{width:2.6px;background:currentColor;border-radius:1px;display:block}
.bat{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3.5px;position:relative;opacity:.9}
.bat::after{content:"";position:absolute;inset:1.6px;right:6px;background:currentColor;border-radius:1.5px}

.body{flex:1;overflow:auto;padding:2px 20px 118px;position:relative;z-index:2;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body.flush{padding:0}
.body>*{animation:rise .5s cubic-bezier(.22,.9,.3,1) both}
.body>*:nth-child(2){animation-delay:.05s}.body>*:nth-child(3){animation-delay:.1s}
.body>*:nth-child(4){animation-delay:.15s}.body>*:nth-child(5){animation-delay:.2s}
.body>*:nth-child(6){animation-delay:.25s}.body>*:nth-child(7){animation-delay:.3s}
.body>*:nth-child(n+8){animation-delay:.34s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= 组件 ================= */
.glass{
  background:linear-gradient(158deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
  backdrop-filter:blur(14px) saturate(1.2);border-radius:var(--r);
  box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.95);
  border:1px solid rgba(255,255,255,.78);padding:16px;position:relative
}
.gilt{
  border:1px solid transparent;
  background:
    linear-gradient(158deg,rgba(255,255,255,.94),rgba(255,253,248,.86)) padding-box,
    linear-gradient(150deg,#FDF3DF,#DCB878 34%,#FBEFD6 58%,#C9A45B 100%) border-box;
}
.card-corner::before,.card-corner::after{
  content:"";position:absolute;width:14px;height:14px;border:1.4px solid rgba(190,150,80,.5);opacity:.9
}
.card-corner::before{left:7px;top:7px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.card-corner::after{right:7px;bottom:7px;border-left:0;border-top:0;border-radius:0 0 4px 0}

.otitle{text-align:center;margin:6px 0 14px}
.otitle .en{font-family:var(--serif);font-style:italic;letter-spacing:.34em;font-size:9px;color:var(--gold-d);opacity:.9}
.otitle h2{font-family:var(--serif);font-size:20px;letter-spacing:.16em;font-weight:600;margin:5px 0 0;color:var(--ink)}
.otitle .rule{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.otitle .rule i{height:1px;width:52px;background:linear-gradient(90deg,transparent,rgba(190,150,80,.75))}
.otitle .rule i+i{background:linear-gradient(270deg,transparent,rgba(190,150,80,.75))}
.otitle .rule b{color:var(--gold-d);font-size:9px}

.nav{display:flex;align-items:center;gap:12px;padding:2px 0 12px;position:relative;z-index:3}
.ib{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:15px;color:var(--ink2);
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.55));
  box-shadow:var(--sh-s),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.85);transition:.2s
}
.ib:hover{transform:translateY(-1px);color:var(--ink)}
.nav h1{font-family:var(--serif);font-size:17px;letter-spacing:.1em;font-weight:600}
.nav h1 small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;color:var(--muted);font-weight:400;margin-top:3px}
.grow{flex:1}

.btn{
  width:100%;padding:14px;border-radius:99px;font-size:15px;font-weight:600;letter-spacing:.06em;
  position:relative;overflow:hidden;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px
}
.btn::after{
  content:"";position:absolute;top:-60%;left:-30%;width:32%;height:220%;transform:rotate(18deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
  animation:sweep 3.6s ease-in-out infinite
}
@keyframes sweep{0%{left:-40%}55%{left:120%}100%{left:120%}}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.gold{
  background:linear-gradient(180deg,#FBEED2 0%,#EDD3A0 40%,#DDB876 62%,#EBD7A9 100%);
  color:#7A5A20;box-shadow:0 10px 24px rgba(190,150,80,.4),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5);
  text-shadow:0 1px 0 rgba(255,255,255,.6)
}
.btn.rose{
  background:linear-gradient(180deg,#FFDCE8 0%,#F8B3CC 42%,#F096B7 100%);
  color:#fff;box-shadow:0 10px 24px rgba(232,140,175,.42),inset 0 1px 0 rgba(255,255,255,.8);
  text-shadow:0 1px 2px rgba(200,110,145,.35)
}
.btn.ice{
  background:linear-gradient(180deg,#EEF4FF 0%,#D5E2F9 45%,#BFD2F3 100%);
  color:#5A6C99;box-shadow:0 10px 24px rgba(130,155,215,.32),inset 0 1px 0 #fff
}
.btn.ghost{
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.6));color:var(--ink);
  box-shadow:var(--sh-s),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.9)
}
.btn.sm{padding:11px;font-size:13px}
.brow{display:flex;gap:10px}

.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:600;letter-spacing:.04em}
.tag.gold{background:linear-gradient(180deg,#FBEDD0,#EBD3A2);color:#8A6A32;box-shadow:inset 0 1px 0 #fff}
.tag.rose{background:linear-gradient(180deg,#FFE3EC,#FBC6D9);color:#C2537F}
.tag.ice{background:linear-gradient(180deg,#EAF1FF,#D3E1FA);color:#5F79B4}
.tag.grey{background:rgba(140,130,165,.14);color:#8A82A2}
.chip{
  padding:7px 13px;border-radius:99px;font-size:11.5px;color:var(--ink2);white-space:nowrap;transition:.2s;
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.6));
  box-shadow:var(--sh-s),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.8)
}
.chip.on{background:linear-gradient(180deg,#FBEED2,#E4C489);color:#7A5A20;font-weight:600;border-color:rgba(255,255,255,.9)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 6px}
.hs::-webkit-scrollbar{display:none}

/* 照片占位 */
.ph{position:relative;overflow:hidden;width:100%;height:100%;background:#E7E1F0}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(190deg,rgba(255,255,255,.2),rgba(60,50,90,.1))}
.ph::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;z-index:1;
  background:linear-gradient(180deg,rgba(52,42,78,0),rgba(52,42,78,.34))}
.ph .gl{position:absolute;width:var(--gs,22%);padding-top:var(--gs,22%);border-radius:50%;
  right:var(--gx,16%);top:var(--gy,14%);z-index:1;
  background:radial-gradient(circle,rgba(255,255,255,.98) 0%,rgba(255,240,210,.55) 38%,rgba(255,240,210,0) 72%)}
.ph .hz{position:absolute;left:0;right:0;top:var(--hz,58%);height:1px;z-index:1;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0))}
.ph .vg{position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 34px rgba(60,44,88,.28)}
.ph .fg{position:absolute;left:0;right:0;bottom:0;height:36%;display:flex;align-items:flex-end;justify-content:center;gap:6%;z-index:2}
.ph .fg i{display:block;width:8.5%;background:rgba(48,36,66,.44);border-radius:44% 44% 16% 16%}
.ph--sunset{background:linear-gradient(180deg,#FCD9C0 0%,#F7AEB6 40%,#E489A9 62%,#8C6A9E 100%)}
.ph--sea{background:linear-gradient(180deg,#CFE6F7 0%,#A8CFEC 44%,#F6E4D2 60%,#E4C7AE 100%)}
.ph--wedding{background:linear-gradient(165deg,#FBEEF2 0%,#EBD4E4 44%,#C6B2D6 100%)}
.ph--forest{background:linear-gradient(180deg,#DCEBE4 0%,#A5C6BA 52%,#6C8F86 100%)}
.ph--night{background:linear-gradient(180deg,#5A4E82 0%,#8A6E9E 44%,#D9A0A8 88%)}
.ph--campus{background:linear-gradient(170deg,#FAEBD3 0%,#E7CDA4 48%,#B9926C 100%)}
.ph--party{background:linear-gradient(155deg,#FFE7CB 0%,#F5B0A2 44%,#B9799C 100%)}
.ph--mountain{background:linear-gradient(180deg,#E4EEF8 0%,#B6CDE4 40%,#8FA9C4 62%,#5E7286 100%)}
.ph--cafe{background:linear-gradient(160deg,#F8E9D8 0%,#E0C4A6 50%,#A9876A 100%)}
.ph--sky{background:linear-gradient(180deg,#FCE9F2 0%,#F3CFE2 44%,#D8AFD4 100%)}
.ph--snow{background:linear-gradient(180deg,#EAF2FB 0%,#CFDDF0 46%,#A9BBD8 100%)}

.rounded{border-radius:18px;overflow:hidden;box-shadow:var(--sh-s)}
.frame-gold{
  padding:4px;border-radius:20px;
  background:linear-gradient(150deg,#FDF3DF,#DCB878 40%,#FBEFD6 62%,#C9A45B);
  box-shadow:var(--sh)
}
.frame-gold>*{border-radius:16px;overflow:hidden;display:block}

.ava{border-radius:50%;border:2px solid rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(120,105,160,.28);flex:none;position:relative;overflow:hidden}
.arow{display:flex}.arow .ava{margin-left:-9px}.arow .ava:first-child{margin-left:0}
.a1{background:linear-gradient(145deg,#FFD3C4,#EE9C93)}
.a2{background:linear-gradient(145deg,#CFE0FA,#8FA9D8)}
.a3{background:linear-gradient(145deg,#F9DFB4,#DDAF6A)}
.a4{background:linear-gradient(145deg,#E6D6F5,#AE92CE)}
.a5{background:linear-gradient(145deg,#D2EDDF,#8CBBA4)}
.a6{background:linear-gradient(145deg,#FBCFDD,#E796B2)}

.field{margin-bottom:10px}
.lab{font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin:0 0 6px 6px}
.inp{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;font-size:13.5px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.6));
  box-shadow:var(--sh-s),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.85)
}
.inp input{border:0;outline:0;background:none;font-size:13.5px;color:var(--ink);flex:1;min-width:0}
.inp .ic{color:var(--gold-d)}
.inp .ar{color:var(--muted);font-size:12px}
.sw{width:44px;height:25px;border-radius:99px;background:rgba(150,138,180,.28);position:relative;transition:.22s;flex:none;box-shadow:inset 0 1px 3px rgba(90,80,130,.2)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 2px 5px rgba(90,80,130,.28)}
.sw.on{background:linear-gradient(90deg,#F3B7CE,#E4C489)}
.sw.on::after{left:22px}

/* 底部 tab */
.tabs{
  position:absolute;left:14px;right:14px;bottom:16px;height:64px;border-radius:26px;z-index:40;
  display:flex;align-items:center;justify-content:space-around;padding:0 8px;
  background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.6));
  backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 12px 30px rgba(105,95,150,.2),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.85)
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--muted);transition:.2s;letter-spacing:.06em}
.tab .ti{font-size:16px;line-height:1}
.tab.on{color:var(--gold-d);font-weight:700}
.tab.on .ti{filter:drop-shadow(0 2px 4px rgba(200,160,90,.5))}
.fab{
  width:50px;height:50px;border-radius:50%;font-size:22px;display:grid;place-items:center;margin-top:-24px;color:#fff;
  background:linear-gradient(180deg,#FFDCE8,#F3A6C0 55%,#E88BAE);
  box-shadow:0 10px 22px rgba(232,140,175,.5),inset 0 1px 0 rgba(255,255,255,.9),0 0 0 4px rgba(255,255,255,.6)
}
.cta{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 30px;z-index:40;
  background:linear-gradient(180deg,rgba(250,240,246,0),rgba(250,240,246,.9) 40%)}

/* 3D 走廊 */
.scene{position:absolute;inset:0;overflow:hidden;perspective:780px;perspective-origin:50% 46%;cursor:grab;
  background:radial-gradient(70% 54% at 50% 43%,#FFF4DE 0%,#EED2AE 16%,#C2A9C8 40%,#7A6D9E 66%,#3A3159 100%)}
.scene:active{cursor:grabbing}
.corr{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .1s linear}
.ring{position:absolute;left:50%;top:50%;width:306px;height:530px;margin:-266px 0 0 -153px;
  border:2px solid rgba(255,244,220,.55);border-radius:153px 153px 12px 12px;
  box-shadow:0 0 60px rgba(255,232,190,.4),inset 0 0 80px rgba(255,228,185,.3);
  background:linear-gradient(180deg,rgba(255,246,226,.08),rgba(120,105,160,.06))}
.gf{position:absolute;left:50%;top:50%;width:132px;height:166px;margin:-92px 0 0 -66px;border-radius:8px;
  border:5px solid rgba(255,240,208,.95);transform-style:preserve-3d;cursor:pointer;transition:filter .2s;
  box-shadow:0 14px 40px rgba(40,30,60,.55),0 0 26px rgba(255,226,180,.45);filter:saturate(1.2) contrast(1.06)}
.gf:hover{filter:brightness(1.15)}
.gf .ph{position:absolute;inset:0}
.floor{position:absolute;left:0;right:0;bottom:0;height:36%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,240,215,.16),rgba(120,100,150,.1) 40%,rgba(46,38,72,.36));
  mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 60%)}
.fog{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(44% 32% at 50% 46%,rgba(255,246,226,.34),rgba(255,246,226,0) 64%),

      <stop offset="0%" stop-color="#F5B8D0"/><stop offset="55%" stop-color="#EBD3A2"/><stop offset="100%" stop-color="#C9A45B"/></linearGradient></defs>

      stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>

function qr(seed=7,n=21){
  let o="";
  const inF=(r,c)=>{for(const[fr,fc]of[[0,0],[0,n-7],[n-7,0]]){const dr=r-fr,dc=c-fc;
    if(dr>=0&&dr<7&&dc>=0&&dc<7)return{hit:1,on:(dr===0||dr===6||dc===0||dc===6)||(dr>=2&&dr<=4&&dc>=2&&dc<=4)};}
    return{hit:0}};
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const f=inF(r,c);
    const on=f.hit?f.on:((r*seed+c*13+((r*c)%7)*5+(r%3)*(c%5))%11)<5;
    o+=`<i class="${on?"b":""}"></i>`;

}

  const ap=()=>{co.style.transform=`translateZ(${corrZ}px)`;const b=$("#wbar");if(b)b.style.width=Math.min(100,8+corrZ/18)+"%"};ap();
  let dg=0,sy=0,sz=0;
  sc.addEventListener("pointerdown",e=>{dg=1;sy=e.clientY;sz=corrZ;sc.setPointerCapture(e.pointerId)});
  sc.addEventListener("pointermove",e=>{if(!dg)return;corrZ=Math.max(0,Math.min(1650,sz+(e.clientY-sy)*2.6));ap()});
  sc.addEventListener("pointerup",()=>dg=0);
  sc.addEventListener("wheel",e=>{e.preventDefault();corrZ=Math.max(0,Math.min(1650,corrZ+e.deltaY*.9));ap()},{passive:false});
  $$(".gf",sc).forEach(f=>f.addEventListener("click",e=>{e.stopPropagation();frameSheet(+f.dataset.fr)}));

}

/* ================= 渲染 ================= */
function render(){
  const vp=$("#vp");
  vp.innerHTML=P[cur]();

function go(id){ if(!P[id])return; cur=id; render(); }

/* 生成过场 */
const LOAD={
  A5:{t:["正在按时间线归位照片","正在铺进模板","好了，几秒就够"],ms:1800,sub:"UNSEEN · 正在生成"},
  A6:{t:["正在识别照片里的场景","正在按时间与地点聚类","正在评估每个场景的重建把握"],ms:3000,sub:"UNSEEN · AI 识别中 · 不收费"},
  A7:{t:["正在从照片里想象出空间","正在把每张照片锚定回机位","正在铺设第一个场景"],ms:2800,sub:"UNSEEN · 正在重建 3D"},
  S2:{t:["正在挑选最好的 12 个瞬间","正在按笑声卡点","正在渲染成片"],ms:2650,sub:"UNSEEN · 正在生成"}
};
function loading(to){
  const K=["sunset","sea","party","wedding","campus","mountain","cafe","night"];
  const fly=K.map((k,i)=>{const a=i/K.length*Math.PI*2;
    return `<div class="lfly" style="left:55px;top:55px;--fx:${Math.cos(a)*150}px;--fy:${Math.sin(a)*150}px;--fr:${(i%2?1:-1)*22}deg;animation-delay:${i*.16}s">${ph(k)}</div>`}).join("");
  $("#vp").insertAdjacentHTML("beforeend",`<div class="loading" id="ld">
    <div class="lwrap"><div class="lring"><div class="halo"></div>${fly}
      <div style="position:absolute;inset:26px;border-radius:50%;border:1px solid rgba(255,255,255,.8);
        box-shadow:inset 0 0 30px rgba(255,236,200,.9),0 0 30px rgba(255,236,200,.6);display:grid;place-items:center;
        font-family:var(--serif);font-size:22px;color:#8A6A32;background:rgba(255,255,255,.4)">忆</div></div>

      <div class="lsub">${LOAD[to].sub}</div>
      <div class="lbar"><i id="lbar"></i></div></div></div>`);
  const L=LOAD[to];let i=0;const tt=setInterval(()=>{i++;const e=$("#ltxt");if(e&&L.t[i])e.textContent=L.t[i]},Math.round(L.ms/3));
  requestAnimationFrame(()=>{const b=$("#lbar");if(b){b.style.transition=`width ${(L.ms-150)/1000}s cubic-bezier(.4,0,.2,1)`;b.style.width="100%"}});
  setTimeout(()=>{clearInterval(tt);go(to)},L.ms);
}

/* B2 对话 */

  $("#sb").onclick=()=>send();
  $("#ci").onkeydown=e=>{if(e.key==="Enter")send()};
  $$("[data-q]").forEach(b=>b.onclick=()=>{$("#ci").value=b.dataset.t;send(b.dataset.q)});
}
function paint(){
  const f=$("#flow");if(!f)return;

    ?`<div class="msg"><div class="bava"></div><div class="bub">${m.t}</div></div>`
    :`<div class="msg me"><div class="bub">${m.t}</div></div>`).join("");
  const b=$(".body");if(b)b.scrollTop=b.scrollHeight;
}
function send(dim){
  const i=$("#ci"),v=(i.value||"").trim();
  if(!v){toast("说点什么，AI 在听");return}
  S.chat.push({w:"me",t:v});i.value="";

  const p=S.photos.find(p=>p.id===1);if(p&&p.s!=="done")p.s="chat";
  paint();
  $("#flow").insertAdjacentHTML("beforeend",`<div class="msg" id="ty"><div class="bava"></div><div class="bub typ"><i></i><i></i><i></i></div></div>`);
  const b=$(".body");b.scrollTop=b.scrollHeight;
  setTimeout(()=>{
    S.stage=Math.min(S.stage+1,ASK.length-1);
    S.chat.push({w:"ai",t:ASK[S.stage]});
    if(cur==="B2")render();
  },780);
}

        落日、四个人、退潮后的沙滩。还差「那天为什么突然安静」，聊完就能成稿。</div>
    </div>
    <div class="brow" style="margin-top:13px">
      <button class="btn ghost sm" style="flex:1" data-go="B2">查看 AI 对话</button>
      <button class="btn gold sm" style="flex:1" data-fav="1">收藏到回忆库</button></div>
  </div>`);
}
/* v2 付费弹层 */
function paySheet(){
  const locked=S.scenes.filter(x=>!x.free&&!x.un);
  $("#vp").insertAdjacentHTML("beforeend",`<div class="mask" data-close="1"></div>
  <div class="sheet"><div class="grip"></div>
    ${otitle("UNLOCK","解锁真实 3D")}
    <div style="font-size:11px;color:var(--ink2);text-align:center;margin:-4px 0 12px;line-height:1.7">首个场景「${S.scenes[0].n}」免费生成试看<br>其余 ${locked.length||S.scenes.length-1} 个场景按下面任一方式解锁</div>
    <div class="pay on" data-popt="all"><div style="flex:1"><div style="font-size:12.5px;font-weight:700">整包解锁 <span class="tag gold" style="margin-left:4px">推荐</span></div><div style="font-size:10px;color:var(--muted);margin-top:3px">一次生成整段旅程，按时间线切换场景</div></div><div class="pr">¥29.9</div></div>
    <div class="pay" data-popt="one"><div style="flex:1"><div style="font-size:12.5px;font-weight:700">单个场景解锁</div><div style="font-size:10px;color:var(--muted);margin-top:3px">想看哪个解锁哪个</div></div><div class="pr">¥9.9<small style="font-size:9px;color:var(--muted)"> /个</small></div></div>
    <div style="font-size:9.5px;color:var(--muted);text-align:center;margin:6px 0 12px;line-height:1.7">价格为演示占位 · 重建失败的场景自动退回模板相册并退回该场景费用</div>
    <button class="btn gold" data-payok="1">确认支付并开始生成</button>
  </div>`);
}
const closeSheet=()=>$$(".mask,.sheet").forEach(e=>e.remove());

/* ================= 事件 ================= */
document.addEventListener("click",e=>{
  const c=s=>e.target.closest(s);
  if(c("[data-close]")){closeSheet();return}
  if(c("[data-fav]")){closeSheet();toast("已收藏到「我的回忆库」");go("B4");return}
  const ld=c("[data-load]");if(ld){loading(ld.dataset.load);return}
  const up=c("[data-up]");if(up){S.space.up=Math.min(S.space.total,S.space.up+6);S.picked+=6;toast("已上传 6 张 · 自动去重完成");render();return}
  const cv=c("[data-cover]");if(cv){S.space.cover=cv.dataset.cover;render();return}
  const tp=c("[data-tpl]");if(tp){S.space.tpl=tp.dataset.tpl;render();return}
  const sw=c("[data-sw]");if(sw){sw.classList.toggle("on");return}
  if(c("[data-ok]")){
    const p=S.photos.find(p=>p.id===1);
    if(p){p.s="done";p.t="那片海记住了我们";p.x="2026 年 5 月 16 日傍晚，三亚海棠湾，你和三个最好的朋友坐在退潮后的沙滩上，看落日一点点沉进海里。"}
    S.chat=[];S.stage=0;S.dims={where:0,who:0,what:0,mood:0};
    toast("已存进我的回忆库 ✦");go("B4");return;
  }
  if(c("[data-exit]")){toast("已保存为「对话中」，随时回来续聊");go("B4");return}
  const ad=c("[data-add]");if(ad){toast("已添加到《"+S.space.name+"》空间");go("A5");return}
  const op=c("[data-open]");if(op){
    const p=S.photos.find(x=>x.id===+op.dataset.open);
    if(p.s==="done"){toast("打开成稿：" + p.t);go("S1")}else go("B2");return;
  }
  const fl=c("[data-fil]");if(fl){
    $$("[data-fil]").forEach(b=>b.classList.remove("on"));fl.classList.add("on");
    const k=fl.dataset.fil;
    $$("[data-mem]").forEach(el=>{const p=S.photos.find(x=>x.id===+el.dataset.mem);
      el.style.display=(k==="all"||p.s===k)?"":"none"});
    return;
  }
  /* v2 */
  const md=c("[data-mode]");if(md){S.mode=md.dataset.mode;render();return}
  const at=c("[data-atpl]");if(at){S.atpl=at.dataset.atpl;render();return}
  if(c("[data-up3d]")){S.mode="3d";go("A4");return}
  const scn=c("[data-scene]");if(scn){S.cur3d=+scn.dataset.scene;render();return}
  const hsl=c("[data-hsel]");if(hsl){const k=hsl.dataset.hsel;S.hsel[k]=S.hsel[k]?0:1;render();return}
  if(c("[data-pay]")){if(cur==="A6H"&&Object.values(S.hsel).filter(Boolean).length<2){toast("至少选 2 个场景");return}closeSheet();paySheet();return}
  const po=c("[data-popt]");if(po){$$("[data-popt]").forEach(x=>x.classList.remove("on"));po.classList.add("on");return}
  if(c("[data-payok]")){closeSheet();S.paid=true;S.scenes.forEach(x=>x.un=true);S.cur3d=0;toast("支付成功（演示）· 开始重建");loading("A7");return}
  if(c("[data-free]")){S.scenes[0].un=true;S.cur3d=0;loading("A7");return}
  const fr=c(".strip .pc[data-fr]");if(fr){frameSheet(+fr.dataset.fr);return}
  const g=c("[data-go]");if(g){closeSheet();go(g.dataset.go);return}
  const ts=c("[data-toast]");if(ts){toast(ts.dataset.toast);return}
});

/* 演示菜单 */
const MENU=[["共同起点",[["SPLASH","启动页"],["P0","首页"],["ME","我的"]]],
  ["路径A · 共创回忆空间",[["A1","创建空间"],["A2","邀请同行"],["A3","多人上传"],["A4","选择生成方式"],["A5","模板相册 · 免费"],["A6","AI 识别确认"],["A6H","识别困难版"],["A7","多场景 3D · 付费"]]],
  ["路径B · 我的回忆库",[["B1","上传一张"],["B2","AI 对话"],["B3","确认成稿"],["B4","回忆库"]]],
  ["传播层",[["S1","制作视频"],["S2","多平台分享"],["S3","静态成片卡"]]]];
$("#demoMenu").innerHTML=MENU.map(([g,it])=>`<h5>${g}</h5>${it.map(([k,n])=>`<button data-jump="${k}">${n}</button>`).join("")}`).join("")
  +`<div class="kbd">← → 翻页 · R 重置数据<br>点相框可展开故事</div>`;
$("#demoFab").onclick=()=>$("#demoMenu").classList.toggle("on");
$("#demoMenu").addEventListener("click",e=>{const b=e.target.closest("[data-jump]");
  if(b){go(b.dataset.jump);$("#demoMenu").classList.remove("on")}});

const ORDER=["P0","A1","A2","A3","A4","A5","A6","A7","B1","B2","B3","B4","S1","S2","S3","ME"];
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    const i=Math.max(0,ORDER.indexOf(cur));
    go(ORDER[(i+(e.key==="ArrowRight"?1:ORDER.length-1))%ORDER.length]);
  }
  if(e.key.toLowerCase()==="r"){S=JSON.parse(JSON.stringify(DEF));toast("演示数据已重置");render()}
  if(e.key==="Escape")closeSheet();
});

/* 背景光斑 + 自适应缩放 */
$("#bokeh").innerHTML=Array.from({length:16},(_,i)=>{
  const s=30+((i*53)%150);
  return `<i style="left:${(i*67)%100}%;top:${(i*41)%100}%;width:${s}px;height:${s}px;
    animation-duration:${11+i%9}s;animation-delay:${-i*1.7}s"></i>`}).join("");
function fit(){document.documentElement.style.setProperty("--ps",Math.min(1,(window.innerHeight-40)/848))}
window.addEventListener("resize",fit);fit();
const h=(location.hash||"").replace("#","").toUpperCase();
if(P[h])cur=h;
render();
window.addEventListener("hashchange",()=>{const k=(location.hash||"").replace("#","").toUpperCase();if(P[k])go(k)});
</script>
</body>
</html>
