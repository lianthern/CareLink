# Drop-in for unseen-operable.service — install as
#   /etc/systemd/system/unseen-operable.service.d/90-memory-limits.conf
#
# unseen-operable currently has NO memory ceiling (audit 2026-08-17: MemoryMax=infinity), on a
# 2C2G box where system-wide memory commit has been climbing (37% -> 81% over two days as more
# services were added). It is the one unit on this box that legitimately needs real headroom: its
# CLIP locator sidecar is a cgroup child of the node process (same
# /system.slice/unseen-operable.service cgroup) and the pair's known steady-state resident size is
# roughly 850MB-1.2GB, not the ~390MB one post-restart snapshot happened to catch mid-warmup.
#
# Values below are sized off that 850MB-1.2GB range, not off the smaller snapshot, with enough
# headroom above the top of that range to avoid punishing normal operation (a fresh CLIP model
# reload, a burst of concurrent requests, GC pauses) — the audit's own ask was explicitly "don't
# set this so tight it misfires":
#   MemoryHigh=1536M  (1.5G) — soft throttle: ~300M above the known typical ceiling. Above this,
#                     the kernel starts reclaiming reclaimable memory / applying backpressure
#                     before anything gets killed. This is where "something is bigger than usual,
#                     lean on it a little" lives.
#   MemoryMax=1792M   (1.75G) — hard cap: ~550M above the known typical ceiling (~1.46x the top of
#                     the 850MB-1.2GB range). This exists to catch a genuine leak before it eats
#                     the rest of the box (and with it, sshd and everything else) — not to
#                     micromanage steady-state usage.
#
# MemorySwapMax is deliberately left UNSET. This box already relies on its 1.9GB swap as the
# safety valve keeping several uncapped/lightly-capped services coexisting on 2GB of RAM (see the
# audit's %commit trend). Forcing this, the single biggest consumer, off swap would convert "the
# CLIP sidecar had to swap for a few seconds during reload" into "the CLIP sidecar got hard
# killed" — the opposite of the ask.
#
# OOMPolicy is deliberately left at the systemd default (continue), not set to `stop` the way
# ops/release/unseen-book-renderer.service.example does. If the kernel OOM-killer ever does have
# to reap something in this cgroup, it will pick the largest/most killable process — plausibly the
# ~450-550MB CLIP sidecar rather than the much smaller node parent — and `continue` lets the node
# process keep serving everything except CLIP-backed search while it (and systemd's Restart=)
# recovers, instead of tearing down and reloading the whole unit (CLIP model included) for a
# problem that was contained to one child process. book-renderer's `stop` makes sense there
# because that unit has no meaningful "partially degraded but still useful" state; operable does.
#
# Applying this to the already-running service requires a restart to take effect cleanly — see
# the report's ordered install steps for the exact commands and a healthz check afterward.
[Service]
MemoryHigh=1536M
MemoryMax=1792M
